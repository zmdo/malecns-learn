<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阶段 2 · 读论文 | MaleCNS 学习指南</title>
<style>
  :root{
    --bg:#070b16; --panel:#0f172a; --panel2:#131c33; --line:#1e293b; --line2:#334155;
    --ink:#e6edf7; --ink2:#b6c2d6; --ink3:#8494ad; --dim:#5b6b85;
    --blue:#7dd3fc; --cyan:#22d3ee; --green:#4ade80; --amber:#fbbf24;
    --red:#f87171; --violet:#a78bfa;
    /* 论文纸面配色：让译文尽可能贴近原文刊物观感 */
    --paper:#ffffff; --paper-ink:#14161a; --paper-dim:#5a6270;
    --paper-line:#dfe3ea; --paper-link:#1552a8;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --serif:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:15.5px; line-height:1.7; -webkit-font-smoothing:antialiased}
  a{color:var(--blue); text-decoration:none}
  a:hover{text-decoration:underline; text-underline-offset:3px}
  code{font-family:var(--mono); font-size:.88em; background:#1a2338; padding:.1em .38em;
    border-radius:5px; color:#a5d8ff; border:1px solid #223052}
  kbd{font-family:var(--mono); font-size:.82em; background:#1a2338; border:1px solid #223052;
    border-bottom-width:2px; border-radius:4px; padding:.08em .42em; color:var(--ink2)}

  /* ---------- 顶栏 ---------- */
  header.bar{position:sticky; top:0; z-index:60; height:56px; display:flex; align-items:center;
    gap:14px; padding:0 20px; background:rgba(7,11,22,.94); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line)}
  .bar .t{font-size:14.5px; color:var(--ink2); font-weight:600}
  .bar .sp{flex:1}
  .bar .meta{font-size:12.5px; color:var(--dim); font-family:var(--mono)}
  .phaseswitch{display:inline-flex; align-items:center; gap:2px; background:#0b1424;
    border:1px solid var(--line); border-radius:9px; padding:3px; flex:0 0 auto}
  .phaseswitch a, .phaseswitch span{display:block; padding:2px 10px; border-radius:6px;
    font-family:var(--mono); font-size:11.5px; line-height:1.7; text-decoration:none;
    color:var(--ink3); white-space:nowrap}
  .phaseswitch a:hover{color:var(--ink); background:#1a2338; text-decoration:none}
  .phaseswitch .on{background:#1a1608; color:var(--amber); font-weight:700}
  @media(max-width:1320px){ .bar .t{display:none} }

  /* ---------- 三栏骨架 ---------- */
  .shell{display:grid; grid-template-columns:300px minmax(0,1fr); align-items:start;
    max-width:1840px; margin:0 auto}
  aside{position:sticky; top:56px; height:calc(100vh - 56px); overflow-y:auto;
    padding:18px 12px 60px 18px; border-right:1px solid var(--line)}
  /* main 固定为一屏高：正文改为在左右两个 .colbody 内部各自滚动 */
  main{min-width:0; height:calc(100vh - 56px); display:flex; flex-direction:column;
    min-height:0; overflow:hidden}

  /* ---------- 侧栏：论文列表 + 本章目录 ---------- */
  aside h4{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim);
    margin:0 0 10px; font-weight:700}
  .pitem{display:block; width:100%; text-align:left; background:transparent;
    border:1px solid transparent; border-radius:10px; color:var(--ink2); font:inherit;
    padding:9px 11px; cursor:pointer; margin:0 0 6px; line-height:1.5}
  .pitem:hover{background:#16233d; color:var(--ink)}
  .pitem.on{background:#16233d; border-color:var(--line2); color:var(--ink)}
  .pitem .no{font-family:var(--mono); font-size:11px; color:var(--amber); font-weight:700}
  .pitem .ti{display:block; font-size:13.2px; font-weight:600; margin-top:2px}
  .pitem .ci{display:block; font-size:11.3px; color:var(--dim); margin-top:3px}
  .pitem .badge{display:inline-block; font-family:var(--mono); font-size:10px;
    padding:0 6px; border-radius:4px; margin-left:6px; vertical-align:1px}
  .badge.oa{background:#0d1a12; color:var(--green); border:1px solid #17411f}
  .badge.sub{background:#1c0f12; color:var(--red); border:1px solid #3b1a1a}
  .toclist{margin:14px 0 0; padding:12px 0 0; border-top:1px solid var(--line)}
  .toclist a{display:block; padding:4px 8px; border-radius:7px; color:var(--ink3);
    font-size:12.6px; line-height:1.45; border-left:2px solid transparent}
  .toclist a:hover{background:#131c33; color:var(--ink); text-decoration:none}
  .toclist a.on{color:var(--amber); border-left-color:var(--amber); background:#1a1608}
  .toclist a .lvl2{padding-left:11px; font-size:12.1px; color:var(--dim)}
  .toclist .done::after{content:"✓"; float:right; color:var(--green); font-size:11px}

  /* ---------- 论文头 ---------- */
  .paperhead{padding:22px 26px 18px; border-bottom:1px solid var(--line)}
  .paperhead h1{font-size:23px; margin:0 0 6px; letter-spacing:-.01em; line-height:1.35}
  .paperhead .cite{font-size:13.4px; color:var(--ink2); margin:0 0 4px}
  .paperhead .meta2{font-size:12.4px; color:var(--dim); font-family:var(--mono)}
  .paperhead .acts{margin-top:12px; display:flex; flex-wrap:wrap; gap:8px}
  .btn{display:inline-block; font-size:13px; font-weight:600; padding:6px 14px;
    border-radius:9px; border:1px solid var(--line2); background:var(--panel2); color:var(--ink2)}
  .btn:hover{border-color:var(--blue); color:var(--ink); text-decoration:none}
  .btn.pri{background:#1a1608; border-color:#3b3212; color:var(--amber)}

  .toolbar{position:sticky; top:56px; z-index:40; display:flex; align-items:center; gap:12px;
    flex-wrap:wrap; padding:9px 26px; background:rgba(7,11,22,.94);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line); font-size:12.6px; color:var(--ink3)}
  .toolbar label{display:inline-flex; align-items:center; gap:6px; cursor:pointer}
  .toolbar input[type=checkbox]{accent-color:var(--green); width:15px; height:15px}
  .toolbar .sp{flex:1}
  .toolbar .stat{font-family:var(--mono); font-size:11.6px; color:var(--dim)}
  .tbtn{font:inherit; font-size:12.4px; background:#131c33; border:1px solid var(--line2);
    color:var(--ink3); border-radius:7px; padding:3px 10px; cursor:pointer}
  .tbtn:hover{color:var(--ink); border-color:var(--blue)}

  /* ---------- 双栏正文（原文 / 译文）—— 各自独立滚动 ---------- */
  /* 中英文同一段的长度差异很大，如果共用整页滚动，越到后面错位越严重。
     所以左右各给一个滚动区，按「段落配对」做双向同步。 */
  .cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0;
    flex:1 1 auto; min-height:0}
  @media(max-width:1180px){
    .cols{grid-template-columns:1fr; grid-template-rows:1fr 1fr}
  }
  .col{min-width:0; display:flex; flex-direction:column; min-height:0}
  .col + .col{border-left:1px solid var(--line)}
  @media(max-width:1180px){ .col + .col{border-left:none; border-top:1px solid var(--line)} }
  .colhead{flex:0 0 auto; padding:7px 26px;
    background:#0b1220; border-bottom:1px solid var(--line);
    font-family:var(--mono); font-size:11.5px; color:var(--dim);
    letter-spacing:.06em; text-transform:uppercase;
    display:flex; align-items:center; gap:8px}
  .colhead .sc{font-size:10.5px; color:var(--dim); text-transform:none; letter-spacing:0}
  /* 真正的滚动容器 */
  .colbody{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:thin; scrollbar-color:#334155 transparent}
  .colbody::-webkit-scrollbar{width:11px}
  .colbody::-webkit-scrollbar-track{background:transparent}
  .colbody::-webkit-scrollbar-thumb{background:#2a3a55; border-radius:6px;
    border:2px solid transparent; background-clip:content-box}
  .colbody::-webkit-scrollbar-thumb:hover{background:#3d5273; background-clip:content-box}

  /* 原文纸面 */
  .orig{padding:18px 26px 40px; font-family:var(--serif);
    font-size:15.4px; line-height:1.72; color:var(--ink2)}
  .trans{padding:18px 26px 40px; font-size:15.6px; line-height:1.86; color:var(--ink2)}

  /* 段落配对：左右同一 id，用于滚动联动高亮 */
  .pair{border-radius:10px; padding:2px 8px; margin:0 -8px 14px; transition:background .18s}
  .pair.hot{background:#141d31}
  .pair.hot .orig-p::before, .pair.hot .trans-p::before{opacity:1}

  .orig-p{margin:0 0 0; position:relative}
  .trans-p{margin:0}
  /* 译文缺失时的提示 */
  .missing{font-size:13px; color:var(--dim); font-style:italic; padding:6px 0;
    border-left:2px solid var(--line2); padding-left:10px}

  .secblock{margin:0 0 26px; scroll-margin-top:170px}
  .secblock h2{font-family:"Segoe UI","Noto Sans SC",sans-serif; font-size:17.5px;
    color:var(--ink); margin:26px 0 10px; padding-bottom:6px;
    border-bottom:1px solid var(--line); letter-spacing:-.005em}
  .secblock h3{font-family:"Segoe UI","Noto Sans SC",sans-serif; font-size:15.2px;
    color:var(--blue); margin:18px 0 8px}
  .secblock .hasnote{color:var(--amber)}

  /* ---------- 标注 ---------- */
  .anno{margin:10px 0 14px; border-left:3px solid var(--amber);
    background:#1a1608; border-radius:0 10px 10px 0; padding:10px 14px;
    font-size:13.6px; line-height:1.72; color:var(--ink2)}
  .anno .h{color:var(--amber); font-weight:700; margin-bottom:4px; font-size:13.4px}
  .anno p{margin:0 0 6px} .anno p:last-child{margin-bottom:0}
  .anno code{font-size:12.4px}
  .anno.blue{border-left-color:var(--blue); background:#0d1526}
  .anno.blue .h{color:var(--blue)}
  .anno.green{border-left-color:var(--green); background:#0d1a12}
  .anno.green .h{color:var(--green)}
  .anno.violet{border-left-color:var(--violet); background:#151027}
  .anno.violet .h{color:var(--violet)}
  .anno.red{border-left-color:var(--red); background:#1c0f12}
  .anno.red .h{color:var(--red)}
  body.hideanno .anno{display:none}

  /* 行内标记 */
  .anno-mark{background:#3b3212; color:#ffe9a8; border-bottom:1px dashed var(--amber);
    padding:0 2px; border-radius:3px; cursor:help}
  .ftag{font-family:var(--mono); font-size:10.5px; color:var(--amber);
    border:1px solid #3b3212; border-radius:5px; padding:0 5px; margin-left:6px;
    vertical-align:1px; white-space:nowrap}

  /* ---------- 图 ---------- */
  figure.fig{margin:18px 0; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:12px}
  figure.fig img{width:100%; height:auto; display:block; border-radius:8px; background:#fff}
  figure.fig figcaption{font-size:12.8px; color:var(--ink3); margin-top:10px;
    line-height:1.65; font-family:var(--serif)}
  figure.fig .flabel{font-family:var(--mono); font-size:11.5px; color:var(--amber);
    font-weight:700; margin-right:6px}
  figure.fig .ftitle{color:var(--ink2); font-weight:700}

  /* ---------- 译文纸面模式 ---------- */
  body.paper .trans{background:var(--paper); color:var(--paper-ink);
    font-family:var(--serif); font-size:16px; line-height:1.8}
  body.paper .trans .secblock h2{color:#0b0d11; border-bottom-color:var(--paper-line);
    font-family:var(--serif); font-size:19px}
  body.paper .trans .secblock h3{color:#2a3140; font-family:var(--serif); font-size:16.4px}
  body.paper .trans a{color:var(--paper-link)}
  body.paper .trans .missing{color:var(--paper-dim); border-left-color:var(--paper-line)}
  body.paper .trans .pair.hot{background:#eef3fb}
  body.paper .orig{background:#f7f8fa; color:#2b3038}

  footer{padding:26px 26px 40px; border-top:1px solid var(--line); color:var(--dim); font-size:13px}
  .phaseswitch.foot{margin-bottom:14px}

  .warnbox{background:#1a1608; border:1px solid #3b3212; border-left:3px solid var(--amber);
    border-radius:11px; padding:13px 17px; margin:16px 26px; font-size:13.6px; color:var(--ink2)}
  .warnbox b{color:var(--amber)}
  .warnbox p{margin:0 0 8px} .warnbox p:last-child{margin-bottom:0}
  .hid{display:none !important}
</style>
</head>
<body>

<header class="bar">
  <nav class="phaseswitch" aria-label="阶段切换">
    <a href="index.html">总览</a>
    <a href="phase0.html">阶段 0</a>
    <a href="phase1.html">阶段 1</a>
    <span class="on">阶段 2 · 读论文</span>
    <a href="neuprint.html">执行台</a>
  </nav>
  <span class="t">读论文</span>
  <span class="sp"></span>
  <span class="meta" id="barMeta">—</span>
</header>

<div class="shell">
  <!-- ================= 侧栏 ================= -->
  <aside>
    <h4>要读的论文</h4>
    <div id="paperList"></div>
    <div class="toclist" id="secList"></div>
  </aside>

  <!-- ================= 主区 ================= -->
  <main>
    <div class="paperhead" id="paperHead"></div>
    <div class="toolbar">
      <label><input type="checkbox" id="cbSync" checked> 滚动同步</label>
      <label><input type="checkbox" id="cbAnno" checked> 显示标注</label>
      <label><input type="checkbox" id="cbPaper" checked> 译文用纸面配色</label>
      <span class="sp"></span>
      <button type="button" id="backToHead" class="tbtn">↑ 回到开头</button>
      <span class="stat" id="progStat"></span>
    </div>

    <div class="cols">
      <div class="col" id="colOrig">
        <div class="colhead">
          <span>原文 · Original（CC-BY 开放获取）</span>
          <span class="sp" style="flex:1"></span>
          <span class="sc" id="scrOrig">0%</span>
        </div>
        <div class="colbody" id="origScroll">
          <div class="orig" id="origCol"></div>
          <div class="warnbox" id="licenseNote" style="margin:0 26px 30px"></div>
        </div>
      </div>
      <div class="col" id="colTrans">
        <div class="colhead">
          <span>译文 · 中文（本站翻译）</span>
          <span class="sp" style="flex:1"></span>
          <span class="sc" id="scrTrans">0%</span>
        </div>
        <div class="colbody" id="transScroll">
          <div class="trans" id="transCol"></div>
          <div style="padding:0 26px 30px; font-size:12.8px; color:var(--dim)">
            <p id="footNote" style="margin:0"></p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 论文结构化正文（由 tools/extract_papers.py / extract_berg.py 生成） -->
<script src="assets/papers/berg.js"></script>
<script src="assets/papers/dorkenwald.js"></script>
<script src="assets/papers/shiu.js"></script>
<!-- 译文与标注（人工撰写，按论文/章节分文件；加载顺序无所谓，会自动合并） -->
<script src="assets/papers/notes-berg.js"></script>
<script src="assets/papers/notes-berg-a.js"></script>
<script src="assets/papers/notes-berg-b.js"></script>
<script src="assets/papers/notes-berg-c.js"></script>
<script src="assets/papers/notes-berg-d.js"></script>
<script src="assets/papers/notes-berg-e.js"></script>
<script src="assets/papers/notes-berg-f.js"></script>
<script src="assets/papers/notes-dorkenwald.js"></script>
<script src="assets/papers/notes-dorkenwald-b.js"></script>
<script src="assets/papers/notes-dorkenwald-c.js"></script>
<script src="assets/papers/notes-dorkenwald-d.js"></script>
<script src="assets/papers/notes-dorkenwald-e.js"></script>
<script src="assets/papers/notes-dorkenwald-f.js"></script>
<script src="assets/papers/notes-dorkenwald-g.js"></script>
<script src="assets/papers/notes-dorkenwald-h.js"></script>
<script src="assets/papers/notes-dorkenwald-i.js"></script>
<script src="assets/papers/notes-dorkenwald-j.js"></script>
<script src="assets/papers/notes-dorkenwald-methods.js"></script>
<script src="assets/papers/notes-shiu.js"></script>
<script src="assets/papers/notes-shiu-a.js"></script>
<script src="assets/papers/notes-shiu-b.js"></script>
<script src="assets/papers/notes-shiu-c.js"></script>
<script src="assets/papers/notes-shiu-d.js"></script>
<script src="assets/papers/notes-shiu-e.js"></script>

<script>
/* =====================================================================
   阶段 2 阅读器
   —— 侧栏切换论文；每篇论文左原文右译文；标注随滚动出现。
   暴露 window.__rd 便于自动化测试（tools/test-reader.js）。
   ===================================================================== */
(function () {
  'use strict';

  var PAPERS = [
    { id:'berg', tag:'主论文 · MaleCNS', no:'01', oa:true, preprint:true,
      title:'Sexual dimorphism in the complete connectome of the Drosophila male central nervous system',
      titleZh:'雄性果蝇完整中枢神经系统连接组的性别二态性',
      cite:'Berg et al. — bioRxiv 预印本 v2（2025-10-30）',
      citePublished:'正式版：Berg et al. 2026, Cell 189(18):5504–5526.e15',
      doi:'10.1101/2025.10.09.680999', pmcid:'bioRxiv 2025.10.09.680999',
      why:'MaleCNS 的主论文。整套学习材料讲的就是这个数据集，所以这是最该先读的一篇。',
      pdf:'https://www.biorxiv.org/content/biorxiv/early/2025/10/30/2025.10.09.680999.full.pdf' },
    { id:'dorkenwald', tag:'背景 · FAFB', no:'02', oa:true,
      title:'Neuronal wiring diagram of an adult brain',
      titleZh:'成年果蝇全脑神经元接线图',
      cite:'Dorkenwald et al. 2024, Nature 634:124–138',
      doi:'10.1038/s41586-024-07558-y', pmcid:'PMC11446842',
      why:'建立「连接组长什么样」的直觉；也是 ≥5 突触阈值与 proofreading 工作量的原始出处。',
      pdf:'https://europepmc.org/articles/PMC11446842?pdf=render' },
    { id:'shiu', tag:'背景 · 仿真', no:'03', oa:true,
      title:'A Drosophila computational brain model reveals sensorimotor processing',
      titleZh:'果蝇计算脑模型揭示感觉运动处理',
      cite:'Shiu et al. 2024, Nature 634:210–219',
      doi:'10.1038/s41586-024-07763-9', pmcid:'PMC11446845',
      why:'阶段 4 做仿真必读；「糖 GRN → SEZ → MN9」标准验证实验的出处。',
      pdf:'https://europepmc.org/articles/PMC11446845?pdf=render' }
  ];

  var RD = window.MCNS_PAPERS || {};
  var state = { id:null, pairSeq:0, pairs:{}, sections:[] };

  /* 译文/标注按论文分文件加载：每个文件往 MCNS_NOTES_PARTS 里推自己的分片，
     这里按顺序深合并（后加载只补缺，不覆盖）。 */
  var NOTES = {};
  function isFilled(v) { return v !== undefined && v !== null && String(v).trim() !== ''; }
  function mergeNotes(paperId, add) {
    if (!add) return;
    var cur = NOTES[paperId] || (NOTES[paperId] = {});
    ['sections', 'paras', 'figs', 'trans'].forEach(function (k) {
      var src = add[k];
      if (!src) return;
      cur[k] = cur[k] || {};
      Object.keys(src).forEach(function (key) {
        if (k === 'trans') {
          // 译文按段合并：后加载的文件只补空位（null / undefined / 空串）
          var dst = cur[k][key];
          var incoming = src[key] || [];
          if (!dst) { cur[k][key] = incoming.slice(); return; }
          incoming.forEach(function (v, i) {
            if (isFilled(v) && !isFilled(dst[i])) dst[i] = v;
          });
        } else if (cur[k][key] === undefined) {
          cur[k][key] = src[key];
        }
      });
    });
  }
  (function absorbNotes() {
    var parts = window.MCNS_NOTES_PARTS || [];
    parts.forEach(function (entry) {
      Object.keys(entry).forEach(function (pid) { mergeNotes(pid, entry[pid]); });
    });
    // 兼容：直接覆盖 MCNS_NOTES（旧写法）
    var direct = window.MCNS_NOTES || {};
    Object.keys(direct).forEach(function (pid) { mergeNotes(pid, direct[pid]); });
  })();

  var $ = function (id) { return document.getElementById(id); };
  var paperList = $('paperList'), secList = $('secList'), paperHead = $('paperHead'),
      origCol = $('origCol'), transCol = $('transCol'), progStat = $('progStat'),
      licenseNote = $('licenseNote'), footNote = $('footNote'), barMeta = $('barMeta'),
      /* 左右两个独立滚动容器 */
      origScroll = $('origScroll'), transScroll = $('transScroll'),
      scrOrig = $('scrOrig'), scrTrans = $('scrTrans');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/[&<>"]/g, function (c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
      });
  }
  /* 正文与标注里允许极少量内联标签，其余一律转义（防注入） */
  var ALLOWED = /^(\/?)(b|i|em|strong|sub|sup|code|span)$/i;
  function inline(s) {
    // 先把尖括号全部转义，再把白名单标签还原
    return esc(s).replace(/&lt;(\/?[A-Za-z]+)&gt;/g, function (m, tag) {
      return ALLOWED.test(tag) ? '<' + tag + '>' : m;
    });
  }

  /* ---------------- 侧栏 ---------------- */
  function renderPaperList() {
    var h = '';
    PAPERS.forEach(function (p) {
      var ok = !!RD[p.id];
      h += '<button class="pitem' + (p.id === state.id ? ' on' : '') +
           '" type="button" data-id="' + p.id + '">' +
           '<span class="no">' + p.no + '</span>' +
           '<span class="badge ' + (p.oa ? 'oa' : 'sub') + '">' +
             (p.oa ? 'CC-BY 开放获取' : '订阅制') + '</span>' +
           '<span class="ti">' + esc(p.titleZh || p.title) + '</span>' +
           '<span class="ci">' + esc(p.cite) + (ok ? '' : ' · 正文待接入') + '</span>' +
           '</button>';
    });
    paperList.innerHTML = h;
  }

  /* ---------------- 工具：block 展平成「可渲染单元」列表 ---------------- */
  function flatten(blocks) {
    var out = [];
    (blocks || []).forEach(function (b, i) {
      out.push({ key: 'b' + i, level: b.level || 1, title: b.title,
                 kind: b.kind, paras: b.paras || [], figs: b.figs || [],
                 subs: b.subs || [] });
    });
    return out;
  }

  /* ---------------- 渲染正文 ---------------- */
  function render(paper) {
    var data = RD[state.id];
    state.pairs = {}; state.sections = []; state.pairSeq = 0;

    if (!data) {
      origCol.innerHTML = '<p class="missing">这篇论文的正文尚未接入。</p>';
      transCol.innerHTML = '<p class="missing">—</p>';
      secList.innerHTML = '';
      progStat.textContent = '';
      return;
    }

    var note = NOTES[state.id] || {};
    var secNotes = note.sections || {};        // 按「章节标题」索引的标注
    var paraNotes = note.paras || {};          // 按「段序号」索引的标注（p1, p2…）

    var oHtml = [], tHtml = [], toc = [], done = 0, total = 0;

    data.blocks.forEach(function (b, bi) {
      var anchor = 'sec-' + state.id + '-' + bi;
      toc.push({ anchor: anchor, title: b.title || '(未命名)', level: b.level || 1 });
      state.sections.push({ anchor: anchor, title: b.title });

      var blocksHtml = [];
      blocksHtml.push(renderBlock(b, anchor, note, bi, { o:oHtml, t:tHtml }));
      // 子章节
      (b.subs || []).forEach(function (s, si) {
        var sanchor = anchor + '-' + si;
        toc.push({ anchor: sanchor, title: s.title, level: 2 });
        state.sections.push({ anchor: sanchor, title: s.title });
        blocksHtml.push(renderBlock(s, sanchor, note, bi + '.' + si, { o:oHtml, t:tHtml }));
      });

      // 统计已完成翻译的段落比例
      var allP = (b.paras || []).concat((b.subs || []).reduce(function (a, s) {
        return a.concat(s.paras || []);
      }, []));
      total += allP.length;
      done += allP.filter(function (_, k) { return hasTrans(note, b, k); }).length;
    });

    origCol.innerHTML = oHtml.join('');
    transCol.innerHTML = tHtml.join('');

    // 目录
    secList.innerHTML = toc.map(function (t) {
      return '<a href="#' + t.anchor + '"' + (t.level === 2 ? ' class="lvl2"' : '') +
             '>' + esc(t.title) + '</a>';
    }).join('');

    progStat.textContent = total
      ? '译文覆盖 ' + done + '/' + total + ' 段'
      : '';
  }

  // 译文是否存在：先看段级 notes，再看章级 translation 数组
  function hasTrans(note, block, k) {
    var st = note.trans || {};
    var arr = st[block.title];
    return !!(arr && arr[k]);
  }

  function renderBlock(b, anchor, note, key, sink) {
    var st = (note.trans || {})[b.title] || [];
    var secAnno = (note.sections || {})[b.title];
    var h2 = b.level === 2 ? 'h3' : 'h2';
    var title = esc(b.title || '(未命名)');
    var mark = secAnno ? '<span class="ftag">有标注</span>' : '';

    // 原文侧：只有标题（标注在译文侧，但原文标题也提示一下）
    var o = '<div class="secblock" id="' + anchor + '">';
    o += '<' + h2 + (secAnno ? ' class="hasnote"' : '') + '>' + title + mark + '</' + h2 + '>';

    // 译文侧：标题同样带标记 —— 标注就渲染在这一侧
    var t = '<div class="secblock" id="' + anchor + '-t">';
    t += '<' + h2 + (secAnno ? ' class="hasnote"' : '') + '>' + title + mark + '</' + h2 + '>';

    // 章级标注（放在章节标题下、正文前）
    if (secAnno && Array.isArray(secAnno)) {
      secAnno.forEach(function (a) { t += annoHtml(a); });
    }

    // 段落配对
    var n = Math.max(b.paras.length, st.length);
    for (var i = 0; i < n; i++) {
      var pid = 'p-' + state.pairSeq++;
      var op = b.paras[i] || '';
      var tp = st[i] || '';
      var pnote = (note.paras || {})[(b.title || '') + '#' + i];
      state.pairs[pid] = true;

      // 有些原文段落是空的或只有一个标点（结构化全文里的排版残留），
      // 这类段落无须翻译，也不该显示「译文待补」
      var trivial = op.replace(/<[^>]+>/g, '').trim().length <= 3;

      o += '<div class="pair" id="' + pid + '"><p class="orig-p">' + inline(op) + '</p></div>';
      t += '<div class="pair" id="' + pid + '-t">';
      if (tp) {
        t += '<p class="trans-p">' + inline(tp) + '</p>';
      } else if (trivial) {
        t += '<p class="missing">（原文此处为空段，无需翻译）</p>';
      } else {
        t += '<p class="missing">本节译文待补（原文见左侧第 ' + (i + 1) + ' 段）</p>';
      }
      if (pnote) t += annoHtml(pnote);
      t += '</div>';
    }

    // 插图（原文侧显示真图；译文侧只显示图注翻译）
    b.figs.forEach(function (f, fi) {
      var fl = f.label || ('图 ' + (fi + 1));
      o += '<figure class="fig">' + (f.url ? '<img loading="lazy" src="' + esc(f.url) +
           '" alt="' + esc(fl) + '">' : '<p class="missing">（图片未接入）</p>') +
           '<figcaption><span class="flabel">' + esc(fl) + '</span>' +
           (f.title ? '<span class="ftitle">' + inline(f.title) + '</span> ' : '') +
           inline(f.caption) + '</figcaption></figure>';
      var figT = (note.figs || {})[fl];
      t += '<figure class="fig"><figcaption><span class="flabel">' + esc(fl) + '</span>' +
           (figT ? inline(figT) : '<span class="missing">图注译文待补</span>') +
           '</figcaption></figure>';
    });

    o += '</div>'; t += '</div>';
    sink.o.push(o); sink.t.push(t);
    return o;
  }

  function annoHtml(a) {
    var cls = 'anno' + (a.tone ? ' ' + a.tone : '');
    var h = '<div class="' + cls + '">';
    if (a.h) h += '<div class="h">' + esc(a.h) + '</div>';
    (Array.isArray(a.body) ? a.body : [a.body]).forEach(function (p) {
      h += '<p>' + inline(p) + '</p>';
    });
    h += '</div>';
    return h;
  }

  /* ---------------- 切换论文 ---------------- */
  function select(id) {
    var p = PAPERS.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    state.id = id;
    renderPaperList();
    var oa = p.oa;
    paperHead.innerHTML =
      '<h1>' + esc(p.title) + '</h1>' +
      '<p class="cite">' + esc(p.cite) +
        (p.citePublished ? '<br><span style="color:var(--amber)">' + esc(p.citePublished) + '</span>' : '') +
        '　·　DOI ' + esc(p.doi) + '　·　' + esc(p.pmcid) + '</p>' +
      '<p class="meta2">' + esc(p.why) + '</p>' +
      '<div class="acts">' +
        '<a class="btn pri" target="_blank" rel="noopener" href="' + esc(p.pdf) +
          '">↗ 打开原文 PDF</a>' +
        (p.oa && !p.preprint ? '<a class="btn" target="_blank" rel="noopener" href="https://europepmc.org/articles/' +
          esc(p.pmcid) + '">↗ 出版方在线原文</a>' : '') +
        '<a class="btn" target="_blank" rel="noopener" href="https://doi.org/' + esc(p.doi) +
          '">↗ DOI</a>' +
      '</div>';
    // 预印本要明确提示：正文来自预印本，数字与正式版不同
    licenseNote.innerHTML = p.preprint
      ? '<p><b>⚠️ 本文正文来自 bioRxiv 预印本，不是 Cell 正式版</b></p>' +
        '<p>选择它的原因：Cell 正式版（2026-09）是<b>订阅制</b>，不能转载；' +
        '而 bioRxiv 预印本 <code>' + esc(p.doi) + '</code> 明确为 <b>CC-BY 4.0</b>，可以合法转载与翻译。</p>' +
        '<p><b>两版的数字有差异，引用请以正式版为准：</b><br>' +
        '· 神经元总数：预印本 <b>166,691</b> · 正式版 <b>166,700</b><br>' +
        '· 细胞类型数：预印本 <b>11,691</b> · 正式版 <b>11,710</b><br>' +
        '· 同型 / 二态 / 雄性特异 / 雌性特异：预印本 <b>7,205 / 114 / 262 / 69</b> · ' +
        '正式版 <b>8,069 / 138 / 289 / 71</b></p>' +
        '<p style="margin-bottom:0">本页译文会<b>照译原文出现的数字</b>（即预印本的），' +
        '并在关键处标注正式版的对应值。阶段 0 的<a href="phase0.html#sources">「本页相对指南的修正」</a>' +
        '一节记录了这套差异的完整清单。</p>'
      : (oa
        ? '<p><b>许可：CC-BY 4.0</b> —— 这篇是开放获取论文，原文可合法转载与翻译。' +
          '左侧正文来自 Europe PMC 的 JATS 结构化全文，段落顺序与原文一致。</p>'
        : '<p><b>注意：订阅制论文</b> —— 本站不转载受版权保护的正文，' +
          '只提供官方链接与你自己的阅读笔记。</p>');
    footNote.textContent = '原文 © 作者／期刊，' + (oa ? '按 CC-BY 4.0 许可转载' : '受版权保护') +
      '；中文译文与标注为本站学习材料。引用请以原文为准。';
    barMeta.textContent = p.cite;
    render(p);
    if (origScroll) origScroll.scrollTop = 0;
    if (transScroll) transScroll.scrollTop = 0;
  }

  /* ==================================================================
     滚动同步
     —— 左右两栏各自独立滚动。中英文同一段的高度差很大，若按「滚动比例」
        同步，误差会随文章长度累积，所以这里按「段落配对」对齐：
        以正在滚动的一侧（leader）为基准，找出它的判定线落在哪一段，
        再把另一侧对应的那一段对到同一条线上。
     ================================================================== */
  var syncOn = true, hotId = null, lockTick = 0;

  /* 段落对：以原文侧元素为基准，两侧同处一个 .colbody 坐标系 */
  var mapEl = {}, pairIds = [], pairIdx = {};
  function buildMap() {
    mapEl = {}; pairIds = []; pairIdx = {};
    var list = origCol.querySelectorAll('.pair');
    for (var i = 0; i < list.length; i++) {
      var id = list[i].id;
      var a = document.getElementById(id);          // 原文侧
      var b = document.getElementById(id + '-t');   // 译文侧
      if (!a || !b) continue;
      mapEl[id] = { a: a, b: b };
      pairIdx[id] = pairIds.length;
      pairIds.push(id);
    }
  }

  /** 段落/章节相对于滚动容器的 top */
  function relTop(el, pane) {
    return el.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop;
  }

  /** 容器内最靠上、且已越过参考线 r 的配对元素 */
  function pairAtOrBefore(pane, r) {
    var lo = 0, hi = pairIds.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      var m = mapEl[pairIds[mid]][pane === origScroll ? 'a' : 'b'];
      if (relTop(m, pane) <= r) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  /** 章节标题里最靠上、且已越过参考线 r 的那个 */
  function sectionAtOrBefore(pane, r) {
    var out = null;
    for (var i = 0; i < state.sections.length; i++) {
      var el = document.getElementById(state.sections[i].anchor);
      if (!el) continue;
      if (relTop(el, pane) <= r) out = state.sections[i]; else break;
    }
    return out;
  }

  function syncScroll(leader, follower, r) {
    if (!follower) return;
    if (!pairIds.length) { follower.scrollTop = 0; return; }
    var i = pairAtOrBefore(leader, r);
    var target;
    if (i < 0) {
      target = 0;                     // 还停在文章最开头
    } else {
      var id = pairIds[i];
      var inLeader = mapEl[id][leader === origScroll ? 'a' : 'b'];
      var off = relTop(inLeader, leader) - r;   // 该段在 leader 里的偏移量
      var inFollower = mapEl[id][follower === origScroll ? 'a' : 'b'];
      target = relTop(inFollower, follower) - off;
    }
    // 夹到合法范围
    var max = follower.scrollHeight - follower.clientHeight;
    target = Math.max(0, Math.min(target, max < 0 ? 0 : max));

    if (Math.abs(follower.scrollTop - target) < 1) return;
    lockTick++;                        // 让随后的 scroll 事件不再反向驱动
    follower.scrollTop = target;
  }

  function updateHot(pane) {
    var probe = 90;
    var i = pairAtOrBefore(pane, pane.scrollTop + probe);
    var id = i >= 0 ? pairIds[i] : null;
    if (id === hotId) { updateToc(pane); return; }
    hotId = id;
    Array.prototype.forEach.call(document.querySelectorAll('.pair.hot'),
      function (el) { el.classList.remove('hot'); });
    if (id) {
      if (mapEl[id].a) mapEl[id].a.classList.add('hot');
      if (mapEl[id].b) mapEl[id].b.classList.add('hot');
    }
    updateToc(pane);
  }

  function updateToc(pane) {
    var active = sectionAtOrBefore(pane, pane.scrollTop + 90);
    Array.prototype.forEach.call(secList.querySelectorAll('a'), function (a) {
      a.classList.toggle('on', !!active && a.getAttribute('href') === '#' + active.anchor);
    });
  }

  function pct(pane) {
    var max = pane.scrollHeight - pane.clientHeight;
    return max > 0 ? Math.round(pane.scrollTop / max * 100) : 0;
  }
  function updatePct(which) {
    if (which !== 'trans' && scrOrig) scrOrig.textContent = pct(origScroll) + '%';
    if (which !== 'orig' && scrTrans) scrTrans.textContent = pct(transScroll) + '%';
  }

  /** 把某一栏滚到指定锚点（目录点击用） */
  function scrollToAnchor(anchor, which) {
    var el = document.getElementById(anchor);
    if (!el) return;
    var pane = which === 'trans' ? transScroll : origScroll;
    var other = pane === origScroll ? transScroll : origScroll;
    var top = Math.max(0, relTop(el, pane));
    pane.scrollTop = top;
    syncScroll(pane, other, top);
    lockTick++;
    updateHot(pane);
    updatePct();
  }

  function makeScrollHandler(self, other) {
    return function () {
      if (lockTick > 0) { lockTick--; return; }
      if (syncOn) syncScroll(self, other, self.scrollTop);
      updateHot(self);
      updatePct();          // 由发起方统一刷新两侧，避免被同步的那侧因锁跳过更新
    };
  }

  if (origScroll) origScroll.addEventListener('scroll',
    makeScrollHandler(origScroll, transScroll), { passive: true });
  if (transScroll) transScroll.addEventListener('scroll',
    makeScrollHandler(transScroll, origScroll), { passive: true });

  // 窗口尺寸变化后段落位置全变，需要重建映射
  var rzT = null;
  window.addEventListener('resize', function () {
    clearTimeout(rzT);
    rzT = setTimeout(function () { buildMap(); }, 180);
  });

  /* ---------------- 控件 ---------------- */
  paperList.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button.pitem') : null;
    if (b) select(b.dataset.id);
  });
  $('cbSync').addEventListener('change', function () {
    syncOn = this.checked;
    if (!syncOn) {
      Array.prototype.forEach.call(document.querySelectorAll('.pair.hot'),
        function (el) { el.classList.remove('hot'); });
    } else if (origScroll) {
      syncScroll(origScroll, transScroll, origScroll.scrollTop);
    }
  });
  $('cbAnno').addEventListener('change', function () {
    document.body.classList.toggle('hideanno', !this.checked);
    // 标注显隐会改变译文栏长度，映射需要重建
    buildMap();
  });
  $('cbPaper').addEventListener('change', function () {
    document.body.classList.toggle('paper', this.checked);
  });
  // 目录点击：滚到对应章节（两栏一起）
  secList.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (href.charAt(0) !== '#') return;
    e.preventDefault();
    scrollToAnchor(href.slice(1), 'orig');
  });
  var backBtn = $('backToHead');
  if (backBtn) backBtn.addEventListener('click', function (e) {
    e.preventDefault();
    if (origScroll) origScroll.scrollTop = 0;
    if (transScroll) transScroll.scrollTop = 0;
    lockTick++;
    hotId = null;
    Array.prototype.forEach.call(document.querySelectorAll('.pair.hot'),
      function (el) { el.classList.remove('hot'); });
    updatePct();
  });

  /* ---------------- 启动 ---------------- */
  document.body.classList.add('paper');
  renderPaperList();
  var first = PAPERS.filter(function (p) { return RD[p.id]; })[0] || PAPERS[0];
  select(first.id);
  buildMap();
  updatePct();

  window.__rd = {
    papers: PAPERS, state: state,
    select: select, render: render,
    getAnnoCount: function () { return document.querySelectorAll('.anno').length; },
    getPairCount: function () { return document.querySelectorAll('.pair').length; },
    hasData: function (id) { return !!RD[id]; },
    /* 供测试使用 */
    buildMap: buildMap,
    pairCount: function () { return pairIds.length; },
    scrollToAnchor: scrollToAnchor,
    syncFrom: function (which) {
      var self = which === 'trans' ? transScroll : origScroll;
      var other = which === 'trans' ? origScroll : transScroll;
      syncScroll(self, other, self.scrollTop);
      updateHot(self);
      updatePct(which);
    },
    hot: function () { return hotId; }
  };
})();
</script>
</body>
</html>
