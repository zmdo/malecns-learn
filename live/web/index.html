<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaleCNS 实时闭环 · 左：蝇体 / 右：脑区</title>
<style>
:root{
  --bg:#070b16; --panel:#0f172a; --panel2:#131c33; --line:#1e293b; --line2:#334155;
  --ink:#e6edf7; --ink2:#b6c2d6; --ink3:#8494ad; --dim:#5b6b85;
  --blue:#7dd3fc; --cyan:#22d3ee; --green:#4ade80; --amber:#fbbf24;
  --red:#f87171; --pink:#f472b6; --violet:#a78bfa;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;font-size:14px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}

header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0d1526,#0a1120)}
header h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em}
header .sub{color:var(--ink3);font-size:12.5px}
header .sp{flex:1}
.badge{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:6px;
  border:1px solid var(--line2);color:var(--ink3)}
.badge.ok{color:var(--green);border-color:#17411f;background:#0d1a12}
.badge.warn{color:var(--amber);border-color:#3b3212;background:#1a1608}

main{flex:1;display:flex;min-height:0}
#left{flex:1 1 52%;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);position:relative}
#right{flex:1 1 48%;display:flex;flex-direction:column;min-width:0}

.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  background:#05080f;overflow:hidden}
#fly{max-width:100%;max-height:100%;display:block;background:#05080f}
#brain{display:block;cursor:grab;touch-action:none}
#brain.drag{cursor:grabbing}

.tag{position:absolute;top:12px;left:14px;font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);font-family:var(--mono);pointer-events:none}
.hint{position:absolute;bottom:10px;left:14px;font-size:11.5px;color:var(--dim);pointer-events:none}

.hud{display:flex;gap:18px;flex-wrap:wrap;padding:9px 16px;border-top:1px solid var(--line);
  background:var(--panel);font-family:var(--mono);font-size:12px;color:var(--ink2)}
.hud b{color:var(--ink);font-weight:700}
.hud .k{color:var(--dim)}

#groups{height:41%;overflow-y:auto;border-top:1px solid var(--line);background:var(--panel)}
.grp{display:flex;align-items:center;gap:9px;padding:5px 14px;cursor:pointer;
  border-bottom:1px solid rgba(30,41,59,.55)}
.grp:hover{background:#16213a}
.grp.on{background:#1b2b1e;box-shadow:inset 3px 0 0 var(--green)}
.grp .nm{flex:0 0 auto;font-size:12.4px;color:var(--ink);min-width:0}
.grp .ct{flex:0 0 62px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--dim)}
.bar{flex:1;height:5px;border-radius:3px;background:#1a2338;overflow:hidden;min-width:30px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#4ade80);transition:width .18s}
.grp .hz{flex:0 0 66px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--cyan)}
.grp.hot .hz{color:var(--green);font-weight:700}

footer{display:flex;align-items:center;gap:14px;padding:9px 16px;border-top:1px solid var(--line);
  background:#0b1424;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
footer label{display:flex;align-items:center;gap:7px}
input[type=range]{width:120px;accent-color:#4ade80}
button{font:inherit;font-size:12.5px;background:#16233d;color:var(--ink2);border:1px solid var(--line2);
  border-radius:7px;padding:5px 12px;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--green)}
button.primary{background:#0d1a12;color:var(--green);border-color:#17411f}
#msg{color:var(--amber)}
.mono{font-family:var(--mono)}
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>MaleCNS 实时闭环</h1>
    <span class="sub">左：解剖级蝇体（MuJoCo）· 右：脑区（点击刺激）</span>
    <span class="sp"></span>
    <span class="badge" id="b-neurons">载入中…</span>
    <span class="badge" id="b-stream">画面连接中…</span>
    <span class="badge" id="b-rt">—</span>
  </header>

  <main>
    <!-- ================= 左：蝇体实时画面 ================= -->
    <section id="left">
      <div class="stage">
        <span class="tag">Live · MuJoCo · NeuroMechFly</span>
        <canvas id="fly" width="720" height="540"></canvas>
      </div>
      <div class="hud">
        <span><span class="k">仿真</span> <b id="h-sim">—</b> s</span>
        <span><span class="k">脉冲/10ms</span> <b id="h-spk">—</b></span>
        <span><span class="k">步态 L/R</span> <b id="h-gait">—</b></span>
        <span><span class="k">位置</span> <b id="h-pos">—</b> mm</span>
        <span><span class="k">曾放电</span> <b id="h-fired">—</b> 神经元</span>
        <span><span class="k">单步</span> <b id="h-loop">—</b> ms</span>
      </div>
    </section>

    <!-- ================= 右：脑区 ================= -->
    <section id="right">
      <div class="stage">
        <span class="tag">MaleCNS 神经毡 · 26 个结构</span>
        <canvas id="brain"></canvas>
        <span class="hint">拖动旋转 · 滚轮缩放 · 点击脑区刺激该处神经元</span>
      </div>
      <div id="groups"></div>
    </section>
  </main>

  <footer>
    <label>刺激强度 <input type="range" id="mv" min="1" max="30" step="1" value="8"><span class="mono" id="mv-v">8</span> mV</label>
    <label>持续 <input type="range" id="ms" min="50" max="2000" step="50" value="400"><span class="mono" id="ms-v">400</span> ms</label>
    <button id="clear">全部停止</button>
    <button id="recenter">蝇子回中心</button>
    <span id="msg"></span>
    <span class="sp" style="flex:1"></span>
    <span class="mono" id="foot-note"></span>
  </footer>
</div>

<script src="/mcns-meshes.js"></script>
<script src="/mcns-3d.js"></script>
<script src="/app.js"></script>
</body>
</html>
